<!doctype html>
<html lang="id" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      /* Anti-kedip: pasang class "dark" & warna status bar sebelum React render.
         Urutan: pilihan tersimpan (localStorage "theme") > pengaturan gelap/terang HP. */
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var d = s ? s === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (d) document.documentElement.classList.add("dark");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", d ? "#171717" : "#ffffff");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/joss-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="google" content="notranslate" />

    <meta name="description" content="Jember Operation Sales System - Sistem Manajemen Penjualan dan Evaluasi Kinerja Yakult Lady Unit DP Jember 1" />

    <meta property="og:description" content="Jember Operation Sales System - Sistem Manajemen Penjualan dan Evaluasi Kinerja Yakult Lady Unit DP Jember 1" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
